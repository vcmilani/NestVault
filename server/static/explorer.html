<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8a940">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NestVault">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<title>NestVault — Explorer</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/nav.css">
<script>(function(){const s=localStorage.getItem('nv-theme'),d=window.matchMedia('(prefers-color-scheme:dark)').matches;if(s?s==='light':!d)document.documentElement.setAttribute('data-theme','light');window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{if(!localStorage.getItem('nv-theme'))e.matches?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme','light');});})();</script>
<style>
  main{max-width:1500px}

  .breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
  .bc-link{background:none;border:none;padding:0;font-family:var(--mono);color:var(--amber);text-decoration:none;font-size:11px;cursor:pointer}
  .bc-link:hover{text-decoration:underline}
  .bc-sep{color:var(--text-mute)}
  .bc-label{color:var(--text-dim)}
  .bc-version{color:var(--text)}

  .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid var(--border);margin-bottom:20px;background:var(--border);animation:fadeUp .3s ease both}
  .stat-box{background:var(--bg2);padding:14px 18px;position:relative;overflow:hidden}
  .stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform .3s}
  .stat-box:hover::before{transform:scaleX(1)}
  .stat-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
  .stat-value{font-size:22px;font-weight:300;color:var(--amber);letter-spacing:-.02em;line-height:1}

  .controls{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-bottom:none;background:var(--bg2)}
  .filter-input{flex:1;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 12px;outline:none;transition:border-color .15s;min-width:0}
  .filter-input:focus{border-color:var(--amber)}
  .filter-input::placeholder{color:var(--text-mute)}
  .cbtn{background:none;border:1px solid var(--border2);color:var(--text-dim);padding:5px 10px;font-family:var(--mono);font-size:10px;cursor:pointer;letter-spacing:.06em;transition:all .15s;white-space:nowrap;flex-shrink:0;user-select:none;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
  .cbtn:hover,.cbtn:active{border-color:var(--amber);color:var(--amber)}
  .cbtn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--border2) !important;color:var(--text-mute) !important}

  /* Version navigator */
  .ver-nav{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border);border-top:none;border-bottom:none;background:var(--bg3)}
  .ver-nav.hidden{display:none}
  .ver-select{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:10px;padding:6px 8px;outline:none;cursor:pointer;flex:1;min-width:0}
  .ver-select:focus{border-color:var(--amber)}
  .ver-select:disabled{opacity:.5;cursor:not-allowed}
  .ver-label{flex-shrink:0;font-size:10px;color:var(--text-mute);letter-spacing:.04em;white-space:nowrap}

  /* Restore hint (non-error, informational notice) */
  .explorer-hint{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--border);border-top:none;border-bottom:none;background:rgba(232,169,64,.08);color:var(--amber);font-size:10.5px;letter-spacing:.02em}
  .explorer-hint.hidden{display:none}

  /* Diff badges */
  .diff-badge{font-size:9px;letter-spacing:.06em;padding:1px 5px;margin-left:5px;flex-shrink:0;vertical-align:middle}
  .diff-add{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 30%,transparent)}
  .diff-mod{background:rgba(232,169,64,.12);color:var(--amber);border:1px solid rgba(232,169,64,.25)}
  .diff-del{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 25%,transparent)}

  /* Folder change dot in column rows */
  .t-change-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:4px;display:inline-block}

  /* Diff summary bar */
  .diff-summary{font-size:10px;color:var(--text-mute);display:flex;gap:12px;align-items:center;padding:5px 14px;border:1px solid var(--border);border-top:none;border-bottom:none;background:var(--bg3);flex-shrink:0}
  .diff-summary.hidden{display:none}
  .diff-summary span{display:flex;align-items:center;gap:4px}

  /* Column (Finder-style) browser */
  .explorer-layout{border:1px solid var(--border);animation:fadeUp .35s .05s ease both;height:calc(100vh - 330px);min-height:400px;overflow:hidden}
  .columns-container{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;background:var(--bg)}
  .columns-container.filtering{display:block;overflow-y:auto;overflow-x:hidden}

  .col-panel{width:260px;min-width:260px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;background:var(--bg)}
  .col-panel:last-child{border-right:none}
  .col-back{display:none}
  .col-header{flex-shrink:0;padding:7px 12px;font-size:10px;letter-spacing:.03em;color:var(--text-dim);background:var(--bg2);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .col-header strong{color:var(--text);font-weight:400}
  .col-body{flex:1;overflow-y:auto;overflow-x:hidden}

  /* Column rows (subpastas + arquivos juntos, como no Finder) */
  .col-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:33px;transition:background .1s;cursor:pointer}
  .col-row:last-child{border-bottom:none}
  .col-row:hover,.col-row:active{background:var(--bg3)}
  .col-row.selected{background:rgba(232,169,64,.06);box-shadow:inset 2px 0 0 var(--amber)}
  .col-row.selected .t-name{color:var(--amber)}
  .t-icon{font-size:11px;margin:0 6px 0 12px;flex-shrink:0}
  .dir-row .t-icon{color:var(--amber)}
  .file-row .t-icon{color:var(--text-mute)}
  .t-name{flex:1;min-width:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;font-size:12px}
  .dir-row .t-name{color:var(--text)}
  .file-row .t-name{color:var(--text-dim)}
  .t-meta{display:flex;align-items:center;gap:6px;padding-right:10px;flex-shrink:0}
  .t-count{font-size:10px;color:var(--text-mute)}
  .t-size{font-size:11px;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
  .t-dl{background:none;border:1px solid transparent;color:var(--text-mute);font-family:var(--mono);font-size:11px;cursor:pointer;padding:2px 8px;transition:all .15s;min-height:36px;display:inline-flex;align-items:center;justify-content:center;user-select:none}
  .t-dl:hover,.t-dl:active{border-color:var(--amber);color:var(--amber)}
  .col-chevron{color:var(--text-mute);font-size:10px;flex-shrink:0}
  .dir-row.selected .col-chevron{color:var(--amber)}

  /* Busca (substitui as colunas por uma lista plana enquanto houver texto no filtro) */
  .flat-head{padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
  .flat-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:33px;padding:5px 14px;gap:8px;background:var(--bg);transition:background .1s}
  .flat-row:hover,.flat-row:active{background:rgba(91,164,207,.025)}
  .flat-row:last-child{border-bottom:none}
  .flat-path{flex:1;font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .flat-path em{color:var(--amber);font-style:normal}

  .empty{padding:40px;line-height:1.8}
  .empty a{color:var(--amber)}

  @media(max-width:768px){
    .stats-bar{grid-template-columns:repeat(2,1fr)}
    .cbtn{min-height:40px}
    .explorer-layout{height:calc(100vh - 305px);min-height:300px}
    .col-panel{display:none;width:100%;min-width:0;border-right:none}
    .col-panel.col-active{display:flex}
    .col-back{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--bg3);color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.04em;cursor:pointer;flex-shrink:0;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
    .filter-input{font-size:16px}
    .ver-btn-label{display:none}
    .ver-label{display:none}
  }
  @media(max-width:480px){
    .t-count{display:none}
    .cbtn{min-height:44px}
    .explorer-layout{height:calc(100vh - 265px)}
  }
</style>
</head>
<body>

<main>

<script src="/static/app.js"></script>
<script>
  const qp    = new URLSearchParams(location.search);
  const LABEL = qp.get('label') || '';
  let currentVersion = qp.get('version') || '';

  let allFiles = [];
  let treeRoot = null;
  let nodeMap  = new Map();

  let openPath         = [];   // segmentos da pasta aberta, ex: ['Documents','Projects']
  let selectedFilePath = null; // original_path normalizado do arquivo selecionado (na coluna mais profunda), ou null

  let allVersions   = [];
  let currentVerIdx = -1;
  let compareData   = null;  // { added: Map<normPath,entry>, deleted: Map, modified: Map }
  let folderChanges = null;  // Map<folderPath, {add,mod,del}>
  let _hintTimer    = null;

  const normPath = p => p.replace(/\\/g, '/').replace(/^\//, '');
  const basename = p => p.replace(/\\/g,'/').split('/').filter(Boolean).pop() || p;

  // -- Tree building (índice caminho→nó, independente de como é exibido) -----
  function buildTree(files) {
    const root = { type:'dir', name:'', path:'', children: new Map(), files:[] };
    nodeMap.clear();
    nodeMap.set('', root);
    for (const f of files) {
      const norm  = f.original_path.replace(/\\/g, '/').replace(/^\//, '');
      const parts = norm.split('/').filter(Boolean);
      let node = root;
      const bn = parts.length ? parts[parts.length - 1] : f.original_path;
      for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (!node.children.has(part)) {
          const childPath = node.path ? node.path + '/' + part : part;
          const child = { type:'dir', name:part, path:childPath, children: new Map(), files:[] };
          node.children.set(part, child);
          nodeMap.set(childPath, child);
        }
        node = node.children.get(part);
      }
      node.files.push({ ...f, _basename: bn });
    }
    return root;
  }

  function computeStats(node) {
    let count = node.files.length;
    let size  = node.files.reduce((s, f) => s + (f.size || 0), 0);
    let dirs  = node.children.size;
    let depth = 0;
    for (const child of node.children.values()) {
      const cs = computeStats(child);
      count += cs.count;
      size  += cs.size;
      dirs  += cs.dirs;
      depth  = Math.max(depth, cs.depth + 1);
      child._stats = cs;
    }
    node._stats = { count, size, dirs, depth };
    return { count, size, dirs, depth };
  }

  // -- Restauração de caminho ao trocar de versão ------------------------------
  // Mantém o maior prefixo de `desiredSegments` que ainda existe na versão
  // carregada no momento (nodeMap já reconstruído para ela). Usado nos 3
  // lugares que trocam de versão/caminho para não perder a navegação.
  function restoreOpenPathForVersion(desiredSegments) {
    const kept = [];
    let cum = '';
    for (const seg of desiredSegments) {
      cum = cum ? cum + '/' + seg : seg;
      if (!nodeMap.has(cum)) break;
      kept.push(seg);
    }
    return kept;
  }

  // -- Colunas estilo Finder ----------------------------------------------------
  function _changeDot(path) {
    const fc = folderChanges?.get(path);
    if (!fc) return '';
    if (fc.add) return `<span class="t-change-dot" style="background:var(--green)" title="${fc.add} adicionado(s)"></span>`;
    if (fc.mod) return `<span class="t-change-dot" style="background:var(--amber)" title="${fc.mod} modificado(s)"></span>`;
    if (fc.del) return `<span class="t-change-dot" style="background:var(--red)" title="${fc.del} removido(s)"></span>`;
    return '';
  }

  function renderColumnRows(node, selectedChildName, selFilePath) {
    const sortedDirs = [...node.children.entries()]
      .sort(([a], [b]) => a.localeCompare(b, 'pt', { sensitivity:'base' }));
    const sortedFiles = [...node.files].sort((a,b) =>
      a._basename.localeCompare(b._basename, 'pt', { sensitivity:'base' }));

    const deletedInFolder = compareData
      ? [...compareData.deleted.values()].filter(f => {
          const fp  = normPath(f.original_path);
          const sep = fp.lastIndexOf('/');
          return (sep >= 0 ? fp.slice(0, sep) : '') === node.path;
        })
      : [];

    if (!sortedDirs.length && !sortedFiles.length && !deletedInFolder.length) {
      return '<div class="empty" style="padding:24px 16px;font-size:11px">Pasta vazia</div>';
    }

    const dirHtml = sortedDirs.map(([name, child]) => {
      const st  = child._stats || { count:0, size:0 };
      const sel = name === selectedChildName;
      return `
<div class="col-row dir-row${sel ? ' selected' : ''}" data-kind="dir" data-path="${esc(child.path)}">
  <span class="t-icon">▸</span>
  <span class="t-name">${esc(name)}</span>
  <div class="t-meta">
    ${_changeDot(child.path)}
    <span class="t-count">${st.count}</span>
    <span class="t-size">${fmtSize(st.size)}</span>
    <span class="col-chevron">›</span>
  </div>
</div>`;
    }).join('');

    const fileHtml = sortedFiles.map(f => {
      const key   = normPath(f.original_path);
      const sel   = key === selFilePath;
      const title = f.sha256 ? `${f.original_path}\n${f.sha256}` : f.original_path;
      const badge = !compareData ? '' :
        compareData.added.has(key)    ? '<span class="diff-badge diff-add" title="Adicionado nesta versão">+</span>' :
        compareData.modified.has(key) ? '<span class="diff-badge diff-mod" title="Modificado nesta versão">~</span>' : '';
      return `
<div class="col-row file-row${sel ? ' selected' : ''}" data-kind="file" data-path="${esc(key)}">
  <span class="t-icon">·</span>
  <span class="t-name" title="${esc(title)}">${esc(f._basename)}</span>
  <div class="t-meta">
    ${badge}
    <span class="t-size">${fmtSize(f.size || 0)}</span>
    <button class="t-dl" data-id="${f.id}" data-name="${esc(f._basename)}" onclick="event.stopPropagation();dlFile(+this.dataset.id,this.dataset.name)" title="Baixar arquivo">↓</button>
  </div>
</div>`;
    }).join('');

    const deletedHtml = deletedInFolder.map(f => {
      const bn = basename(f.original_path);
      return `
<div class="col-row file-row" style="opacity:.55;cursor:default" data-kind="deleted">
  <span class="t-icon" style="color:var(--red)">·</span>
  <span class="t-name" style="text-decoration:line-through;color:var(--text-mute)" title="${esc(f.original_path)}">${esc(bn)}</span>
  <div class="t-meta">
    <span class="diff-badge diff-del" title="Removido nesta versão">−</span>
    <span class="t-size">${fmtSize(f.size || 0)}</span>
  </div>
</div>`;
    }).join('');

    return dirHtml + fileHtml + deletedHtml;
  }

  function renderColumnPanel(node, depth, selectedChildName, selFilePath, isLast) {
    const label  = node.path ? basename(node.path) : 'raiz';
    const backBtn = (isLast && depth > 0)
      ? `<button class="col-back" data-back="1">‹ Voltar</button>` : '';
    return `
<div class="col-panel" data-depth="${depth}">
  ${backBtn}
  <div class="col-header"><strong>${esc(label)}</strong> · ${node.children.size} pasta(s), ${node.files.length} arq.</div>
  <div class="col-body">${renderColumnRows(node, selectedChildName, selFilePath)}</div>
</div>`;
  }

  function renderColumns() {
    const container = document.getElementById('columnsContainer');
    container.classList.remove('filtering');
    let html = '';
    let cum  = '';
    for (let d = 0; d <= openPath.length; d++) {
      const node = nodeMap.get(cum);
      if (!node) break;
      const childSel = d < openPath.length ? openPath[d] : null;
      const isLast   = d === openPath.length;
      html += renderColumnPanel(node, d, childSel, isLast ? selectedFilePath : null, isLast);
      if (childSel) cum = cum ? cum + '/' + childSel : childSel;
    }
    container.innerHTML = html;
    const panels = container.querySelectorAll('.col-panel');
    panels.forEach((p, i) => p.classList.toggle('col-active', i === panels.length - 1));
    container.scrollLeft = container.scrollWidth;
  }

  function renderBreadcrumbPath() {
    const el = document.getElementById('bcPath');
    if (!openPath.length) { el.innerHTML = ''; return; }
    let html = '<span class="bc-sep">/</span><button class="bc-link" data-jump="">raiz</button>';
    let cum = '';
    openPath.forEach((seg, i) => {
      cum = cum ? cum + '/' + seg : seg;
      const isLast = i === openPath.length - 1;
      html += '<span class="bc-sep">/</span>' + (isLast
        ? `<span class="bc-version">${esc(seg)}</span>`
        : `<button class="bc-link" data-jump="${esc(cum)}">${esc(seg)}</button>`);
    });
    el.innerHTML = html;
  }

  function syncUrlPath() {
    const url = new URL(location.href);
    if (openPath.length) url.searchParams.set('path', openPath.join('/'));
    else url.searchParams.delete('path');
    history.replaceState({}, '', url);
  }

  function openFolder(path) {
    openPath         = path ? path.split('/').filter(Boolean) : [];
    selectedFilePath = null;
    renderColumns();
    renderBreadcrumbPath();
    syncUrlPath();
  }

  // -- Clique nas colunas / breadcrumb (delegado) ------------------------------
  document.addEventListener('click', e => {
    const backBtn = e.target.closest('.col-back');
    if (backBtn) { openFolder(openPath.slice(0, -1).join('/')); return; }

    const jumpBtn = e.target.closest('.bc-link[data-jump]');
    if (jumpBtn) { openFolder(jumpBtn.dataset.jump); return; }

    const row = e.target.closest('.col-row');
    if (!row) return;
    const panel = row.closest('.col-panel');
    const depth = +panel.dataset.depth;
    if (row.dataset.kind === 'dir') {
      const name = basename(row.dataset.path);
      openPath         = [...openPath.slice(0, depth), name];
      selectedFilePath = null;
      renderColumns();
      renderBreadcrumbPath();
      syncUrlPath();
    } else if (row.dataset.kind === 'file') {
      openPath         = openPath.slice(0, depth);
      selectedFilePath = row.dataset.path;
      renderColumns();
      renderBreadcrumbPath();
      syncUrlPath();
    }
  });

  // -- Aviso de restauração parcial (não é erro — usa a paleta âmbar) ----------
  function showFolderHint(msg) {
    const el = document.getElementById('explorerHint');
    clearTimeout(_hintTimer);
    if (!msg) { el.classList.add('hidden'); return; }
    el.textContent = msg;
    el.classList.remove('hidden');
    _hintTimer = setTimeout(() => el.classList.add('hidden'), 6000);
  }

  // -- Filtro (busca plana, substitui as colunas enquanto houver texto) -------
  let _filterTimer = null;
  function onFilterDebounced(value) {
    clearTimeout(_filterTimer);
    _filterTimer = setTimeout(() => onFilter(value), 250);
  }

  function onFilter(q) {
    q = q.trim();
    const container = document.getElementById('columnsContainer');
    if (!q) {
      renderColumns();
      return;
    }
    container.classList.add('filtering');
    const ql      = q.toLowerCase();
    const matched = allFiles.filter(f => f.original_path.toLowerCase().includes(ql));
    if (!matched.length) {
      container.innerHTML = `<div class="empty">Nenhum arquivo encontrado para "<strong>${esc(q)}</strong>"</div>`;
      return;
    }
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    container.innerHTML =
      `<div class="flat-head">${matched.length} resultado(s)</div>` +
      matched.map(f => {
        const escaped     = esc(f.original_path);
        const highlighted = escaped.replace(re, m => `<em>${m}</em>`);
        return `
<div class="flat-row">
  <span class="t-icon" style="color:var(--text-mute);flex-shrink:0;margin-left:0">·</span>
  <span class="flat-path" title="${esc(f.original_path)}">${highlighted}</span>
  <div class="t-meta">
    <span class="t-size">${fmtSize(f.size || 0)}</span>
    <button class="t-dl" data-id="${f.id}" data-name="${esc(basename(f.original_path))}" onclick="dlFile(+this.dataset.id,this.dataset.name)" title="Baixar arquivo">↓</button>
  </div>
</div>`;
      }).join('');
  }

  // -- Download -----------------------------------------------------------------
  async function dlFile(fileId, filename) {
    try {
      const r = await fetch(`/files/${fileId}/download`, { headers: H() });
      if (r.status === 401) { showLogin(); return; }
      if (r.status === 403) { showLogin('Esta chave não tem permissão de administrador.'); return; }
      if (!r.ok) { showError(`Erro ${r.status} ao baixar o arquivo`); return; }
      const blob = await r.blob();
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch(e) {
      showError('Erro ao baixar: ' + e.message);
    }
  }

  // -- Navegação entre versões --------------------------------------------------
  async function loadVersionList() {
    if (!LABEL) return;
    try {
      const r = await fetch(`/backups/${encodeURIComponent(LABEL)}/versions`, { headers: H() });
      if (!r.ok) return;
      allVersions = (await r.json()).sort((a, b) =>
        a.version_key < b.version_key ? -1 : 1);
      currentVerIdx = allVersions.findIndex(v => v.version_key === currentVersion);
      renderVerNav();
    } catch(e) { /* non-critical */ }
  }

  function renderVerNav() {
    const nav = document.getElementById('verNav');
    if (allVersions.length <= 1) { nav.classList.add('hidden'); return; }
    nav.classList.remove('hidden');
    document.getElementById('verLabel').textContent =
      currentVerIdx >= 0 ? `${currentVerIdx + 1}/${allVersions.length}` : '—';
    document.getElementById('verPrev').disabled = currentVerIdx <= 0;
    document.getElementById('verNext').disabled = currentVerIdx >= allVersions.length - 1;
    const sel = document.getElementById('verSelect');
    sel.disabled  = false;
    sel.innerHTML = allVersions.map((v, i) =>
      `<option value="${i}"${i === currentVerIdx ? ' selected' : ''}>${esc(v.version_key.slice(0, 19).replace('T', ' '))}</option>`
    ).join('');
  }

  function navigateVersion(delta) {
    return goToVersion(currentVerIdx + delta);
  }

  async function goToVersion(newIdx) {
    if (newIdx < 0 || newIdx >= allVersions.length || newIdx === currentVerIdx) return;
    document.getElementById('verPrev').disabled   = true;
    document.getElementById('verNext').disabled   = true;
    document.getElementById('verSelect').disabled = true;

    const newVer      = allVersions[newIdx].version_key;
    const prevVer      = newIdx > 0 ? allVersions[newIdx - 1].version_key : null;
    const desiredPath  = [...openPath];
    currentVerIdx  = newIdx;
    currentVersion = newVer;
    document.getElementById('filterInput').value = '';

    const ok = await loadFilesData(newVer);
    if (!ok) { renderVerNav(); return; }

    if (prevVer) {
      await fetchCompare(prevVer, newVer);
    } else {
      compareData = null; folderChanges = null;
      document.getElementById('diffSummary').classList.add('hidden');
    }

    openPath         = restoreOpenPathForVersion(desiredPath);
    selectedFilePath = null;
    renderColumns();
    renderBreadcrumbPath();
    renderVerNav();

    const url = new URL(location.href);
    url.searchParams.set('version', newVer);
    if (openPath.length) url.searchParams.set('path', openPath.join('/'));
    else url.searchParams.delete('path');
    history.pushState({}, '', url);

    if (openPath.length < desiredPath.length) {
      showFolderHint(`Pasta "${desiredPath.join('/')}" não existe nesta versão — mostrando "${openPath.join('/') || 'raiz'}".`);
    } else {
      showFolderHint('');
    }
  }

  async function fetchCompare(v1, v2) {
    try {
      const r = await fetch(
        `/backups/${encodeURIComponent(LABEL)}/compare?v1=${encodeURIComponent(v1)}&v2=${encodeURIComponent(v2)}`,
        { headers: H() }
      );
      if (!r.ok) { compareData = null; folderChanges = null; return; }
      const data = await r.json();
      compareData = {
        added:    new Map(data.added.map(f    => [normPath(f.original_path), f])),
        deleted:  new Map(data.deleted.map(f  => [normPath(f.original_path), f])),
        modified: new Map(data.modified.map(f => [normPath(f.original_path), f])),
      };
      folderChanges = buildFolderChanges(data);
      updateDiffSummary(data);
    } catch(e) { compareData = null; folderChanges = null; }
  }

  function buildFolderChanges(data) {
    const m = new Map();
    function mark(filePath, type) {
      const parts = normPath(filePath).split('/');
      if (!m.has('')) m.set('', { add:0, mod:0, del:0 });
      m.get('')[type]++;
      for (let i = 1; i < parts.length; i++) {
        const fp = parts.slice(0, i).join('/');
        if (!m.has(fp)) m.set(fp, { add:0, mod:0, del:0 });
        m.get(fp)[type]++;
      }
    }
    data.added.forEach(f    => mark(f.original_path, 'add'));
    data.deleted.forEach(f  => mark(f.original_path, 'del'));
    data.modified.forEach(f => mark(f.original_path, 'mod'));
    return m;
  }

  function updateDiffSummary(data) {
    const el = document.getElementById('diffSummary');
    if (!data || (!data.added.length && !data.deleted.length && !data.modified.length)) {
      el.classList.add('hidden'); return;
    }
    el.classList.remove('hidden');
    el.innerHTML =
      `<span><span class="diff-badge diff-add">+${data.added.length}</span> adicionados</span>` +
      `<span><span class="diff-badge diff-mod">~${data.modified.length}</span> modificados</span>` +
      `<span><span class="diff-badge diff-del">-${data.deleted.length}</span> removidos</span>` +
      `<span style="margin-left:auto">${data.summary_unchanged} inalterados</span>`;
  }

  // -- Carga ----------------------------------------------------------------------
  async function loadFilesData(versionKey) {
    const container = document.getElementById('columnsContainer');

    if (!LABEL || !versionKey) {
      container.innerHTML = `<div class="empty">Nenhuma versão selecionada.<br><a href="/">← Voltar ao dashboard</a></div>`;
      return false;
    }

    document.getElementById('bcLabel').textContent   = LABEL;
    document.getElementById('bcVersion').textContent = versionKey;
    document.title = `NestVault — ${LABEL} / ${versionKey}`;
    container.innerHTML = '<div class="loading">Carregando</div>';

    try {
      const url = `/files?backup_label=${encodeURIComponent(LABEL)}&version_key=${encodeURIComponent(versionKey)}`;
      const r   = await fetch(url, { headers: H() });
      if (r.status === 401) { showLogin(); return false; }
      if (r.status === 403) { showLogin('Esta chave não tem permissão de administrador.'); return false; }
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      allFiles = await r.json();

      if (!allFiles.length) {
        container.innerHTML = '<div class="empty">Nenhum arquivo nesta versão</div>';
        ['sFiles','sDirs','sSize','sDepth'].forEach(id =>
          document.getElementById(id).textContent = '0');
        return false;
      }

      treeRoot    = buildTree(allFiles);
      const stats = computeStats(treeRoot);

      document.getElementById('sFiles').textContent = stats.count.toLocaleString('pt-BR');
      document.getElementById('sDirs').textContent  = stats.dirs.toLocaleString('pt-BR');
      document.getElementById('sSize').textContent  = fmtSize(stats.size);
      document.getElementById('sDepth').textContent = stats.depth;

      return true;
    } catch(e) {
      container.innerHTML = `<div class="empty">Erro ao carregar: ${esc(e.message)}</div>`;
      showError('Não foi possível carregar: ' + e.message);
      return false;
    }
  }

  async function loadFiles() {
    compareData = null; folderChanges = null;
    document.getElementById('diffSummary').classList.add('hidden');
    const ok = await loadFilesData(currentVersion);
    if (ok) {
      const desired = (qp.get('path') || '').split('/').filter(Boolean);
      openPath         = restoreOpenPathForVersion(desired);
      selectedFilePath = null;
      renderColumns();
      renderBreadcrumbPath();
      if (openPath.length < desired.length) {
        showFolderHint(`Pasta "${desired.join('/')}" não existe nesta versão — mostrando "${openPath.join('/') || 'raiz'}".`);
      }
      if (openPath.join('/') !== desired.join('/')) syncUrlPath();
      // Carregada aqui (não em init()) porque, sem API key salva ainda, o
      // primeiro carregamento cai em 401 e app.js só reexecuta loadFiles()
      // após o login (_nvRefresh) — se a versão ficasse só em init(), a
      // barra de versões nunca apareceria até um refresh manual da página.
      await loadVersionList();
    }
  }

  // -- Init — a própria carga inicial faz o auth-check (401 → login) ---------
  (async function init() {
    await loadFiles();
  })();

  // -- Voltar/avançar do navegador ---------------------------------------------
  window.addEventListener('popstate', () => {
    const qp2 = new URLSearchParams(location.search);
    const v   = qp2.get('version') || '';
    const p   = qp2.get('path') || '';
    const desired = p ? p.split('/').filter(Boolean) : [];
    if (v && v !== currentVersion) {
      currentVersion = v;
      currentVerIdx  = allVersions.findIndex(v2 => v2.version_key === v);
      compareData    = null; folderChanges = null;
      document.getElementById('diffSummary').classList.add('hidden');
      loadFilesData(v).then(ok => {
        if (!ok) return;
        openPath         = restoreOpenPathForVersion(desired);
        selectedFilePath = null;
        renderColumns();
        renderBreadcrumbPath();
        renderVerNav();
      });
    } else {
      openPath         = restoreOpenPathForVersion(desired);
      selectedFilePath = null;
      renderColumns();
      renderBreadcrumbPath();
    }
  });
</script>
<script src="/static/nav.js"></script>
